name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (main+core, renderer)
        run: npm run typecheck

      - name: Unit + API smoke tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: QA server + full UI smoke (30 routes)
        run: |
          npx esbuild scripts/qa-server.ts --bundle --platform=node --format=cjs \
            --external:better-sqlite3 --external:express --outfile=out/qa/server.cjs
          node out/qa/server.cjs &
          MQ_QA_FRESH=1 MQ_QA_PORT=8081 MQ_QA_DATA=out/qa-data-fresh node out/qa/server.cjs &
          sleep 2
          bash scripts/qa-seed.sh
          npx vitest run --config tests/vitest.config.ts tests/ui-smoke.test.tsx tests/firstrun-ui.test.tsx

  windows-installer:
    runs-on: windows-latest
    needs: verify
    permissions:
      contents: write
    # automatic on main; also builds on the release-candidate branch for validation
    if: github.ref == 'refs/heads/main' || github.head_ref == 'arena/01a0abb2-merqo-retail-suite-official' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Build + package NSIS installer
        run: npm run dist
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 0

      - name: Record installer name + SHA256
        shell: pwsh
        run: |
          $exe = Get-ChildItem release/*.exe | Select-Object -First 1
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          $info = "file=$($exe.Name)`nsize=$($exe.Length)`nsha256=$sha`ncommit=$env:GITHUB_SHA"
          $info | Out-File -Encoding utf8 release/installer-info.txt
          Write-Host $info
          Add-Content $env:GITHUB_STEP_SUMMARY "`n``````
          $info
          ``````"

      - name: Upload checksum manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-info
          path: release/installer-info.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish installer to GitHub release (v1.0.0-rc)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.0-rc"
          $exe = Get-ChildItem release/*.exe | Select-Object -First 1
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --prerelease --title "MERQO Retail Suite 1.0.0 (Release Candidate)" --notes "Windows installer built by CI from commit $env:GITHUB_SHA. Verify the SHA256 in the installer-info artifact before installing."
          }
          gh release upload $tag $exe.FullName --repo $env:GITHUB_REPOSITORY --clobber

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MERQO-Retail-Suite-Setup
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
