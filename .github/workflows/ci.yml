name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (main+core, renderer)
        run: npm run typecheck

      - name: Unit + API smoke tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: QA server + full UI smoke (30 routes)
        run: |
          npx esbuild scripts/qa-server.ts --bundle --platform=node --format=cjs \
            --external:better-sqlite3 --external:express --outfile=out/qa/server.cjs
          node out/qa/server.cjs &
          MQ_QA_FRESH=1 MQ_QA_PORT=8081 MQ_QA_DATA=out/qa-data-fresh node out/qa/server.cjs &
          sleep 2
          bash scripts/qa-seed.sh
          npx vitest run --config tests/vitest.config.ts tests/ui-smoke.test.tsx tests/firstrun-ui.test.tsx

  windows-installer:
    runs-on: windows-latest
    needs: verify
    permissions:
      contents: write
    # automatic on main; also builds on the release-candidate branch for validation
    if: github.ref == 'refs/heads/main' || github.head_ref == 'arena/01a0abb2-merqo-retail-suite-official' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Build + package NSIS installer
        run: npm run dist
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 0

      - name: Record installer name + SHA256
        shell: pwsh
        run: |
          $exe = Get-ChildItem release/*.exe | Select-Object -First 1
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          $info = "file=$($exe.Name)`nsize=$($exe.Length)`nsha256=$sha`ncommit=$env:GITHUB_SHA"
          $info | Out-File -Encoding utf8 release/installer-info.txt
          Write-Host $info
          Add-Content $env:GITHUB_STEP_SUMMARY "`n``````
          $info
          ``````"

      - name: Upload checksum manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-info
          path: release/installer-info.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish installer to GitHub release (v1.0.0-rc)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.0-rc"
          $exe = Get-ChildItem release/*.exe | Select-Object -First 1
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --prerelease --title "MERQO Retail Suite 1.0.0 (Release Candidate)" --notes "Windows installer built by CI from commit $env:GITHUB_SHA. Verify the SHA256 in the installer-info artifact before installing."
          }
          gh release upload $tag $exe.FullName --repo $env:GITHUB_REPOSITORY --clobber

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MERQO-Retail-Suite-Setup
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  # ── PHYSICAL packaged-app smoke: install the real NSIS exe on real Windows and launch it ──
  packaged-smoke:
    runs-on: windows-latest
    needs: windows-installer
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: MERQO-Retail-Suite-Setup
          path: installer

      - name: Silent install
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer/*.exe | Select-Object -First 1
          Write-Host "Installing $($setup.Name)"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait -PassThru
          Write-Host "installer exit: $($p.ExitCode)"
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "MERQO*.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch "Uninstall" } | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem "$env:ProgramFiles" -Directory -Filter "MERQO*" | ForEach-Object { Get-ChildItem $_.FullName -Recurse -Filter "MERQO*.exe" } | Where-Object { $_.Name -notmatch "Uninstall" } | Select-Object -First 1 }
          if (-not $exe) { throw "installed exe not found" }
          Write-Host "exe: $($exe.FullName)"
          "EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Launch packaged app (smoke mode)
        shell: pwsh
        env:
          MQ_SMOKE: '1'
          MQ_SMOKE_OUT: ${{ github.workspace }}\smoke-report.json
        run: |
          $proc = Start-Process -FilePath $env:EXE -ArgumentList "--enable-logging" -PassThru -RedirectStandardError electron-stderr.log -RedirectStandardOutput electron-stdout.log
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            if (Test-Path smoke-report.json) { break }
            if ($proc.HasExited) { Write-Host "app exited early: code=$($proc.ExitCode)"; break }
          }
          Start-Sleep -Seconds 3
          try { Stop-Process -Name "MERQO Retail Suite" -Force -ErrorAction SilentlyContinue } catch {}
          Write-Host "=== smoke-report.json ==="
          if (Test-Path smoke-report.json) { Get-Content smoke-report.json | Write-Host } else { Write-Host "(missing)" }
          Write-Host "=== electron stderr ==="
          if (Test-Path electron-stderr.log) { Get-Content electron-stderr.log -Tail 40 | Write-Host }
          $appLog = "$env:APPDATA\MERQO Retail Suite\logs\main.log"
          Write-Host "=== app main.log ==="
          if (Test-Path $appLog) { Get-Content $appLog -Tail 40 | Write-Host } else { Write-Host "(missing: $appLog)" }
          if (-not (Test-Path smoke-report.json)) { throw "PACKAGED SMOKE FAILED: no report within 60s (see electron stderr + main.log above)" }
          $r = Get-Content smoke-report.json | ConvertFrom-Json
          if (-not $r.rendererAlive) { throw "PACKAGED SMOKE FAILED: renderer never became alive ($($r.error) $($r.coreError) $($r.detail))" }
          if (-not $r.coreHealthOk) { throw "PACKAGED SMOKE FAILED: embedded core not healthy after render ($($r.coreDetail))" }
          Write-Host "PACKAGED SMOKE PASSED — renderer alive, core healthy, version $($r.version)"

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-smoke-diagnostics
          path: |
            smoke-report.json
            electron-stderr.log
            electron-stdout.log
          if-no-files-found: ignore
          retention-days: 30
