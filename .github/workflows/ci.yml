name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (main+core, renderer)
        run: npm run typecheck

      - name: Unit + API smoke tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: QA server + full UI smoke (30 routes)
        run: |
          npx esbuild scripts/qa-server.ts --bundle --platform=node --format=cjs \
            --external:better-sqlite3 --external:express --outfile=out/qa/server.cjs
          node out/qa/server.cjs &
          MQ_QA_FRESH=1 MQ_QA_PORT=8081 MQ_QA_DATA=out/qa-data-fresh node out/qa/server.cjs &
          sleep 2
          bash scripts/qa-seed.sh
          npx vitest run --config tests/vitest.config.ts tests/ui-smoke.test.tsx tests/firstrun-ui.test.tsx

  windows-installer:
    runs-on: windows-latest
    needs: verify
    # automatic on main; also runnable via workflow_dispatch on the RC branch
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Build + package NSIS installer
        run: npm run dist
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 0

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MERQO-Retail-Suite-Setup
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
